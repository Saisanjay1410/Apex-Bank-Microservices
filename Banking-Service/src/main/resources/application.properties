spring.application.name=banking-service

server.port=8081

# ==========================
# DATABASE
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_payroll}
spring.datasource.username=root
spring.datasource.password=Sanjay@2004

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================
# EUREKA
# ==========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# ==========================
# KAFKA
# ==========================
spring.kafka.bootstrap-servers=localhost:9092
# JWT - set JWT_SECRET in the environment; must be at least 32 characters

jwt.secret=your-very-long-secret-key-at-least-32-bytes
jwt.expiration=3600000

# ==========================
# SWAGGER / OPENAPI
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
